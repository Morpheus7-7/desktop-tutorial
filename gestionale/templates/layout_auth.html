<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Gestionale Assicurativo{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%231e3a8a' d='M8 0l6 2v5c0 4-2.7 6.7-6 9-3.3-2.3-6-5-6-9V2z'/%3E%3Cpath fill='%23fff' d='M11.4 5.6l-4 4-2-2 .9-.9 1.1 1.1 3.1-3.1z'/%3E%3C/svg%3E">
  <link href="{{ url_for('static', filename='vendor/bootstrap.min.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='vendor/bootstrap-icons.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body class="ga-auth">
  <main class="ga-auth-box">
    <div class="text-center mb-4">
      <span class="ga-brand-logo ga-brand-logo-lg"><i class="bi bi-shield-check"></i></span>
      <h1 class="h4 mt-3 mb-0 fw-bold">Gestionale Assicurativo</h1>
      <div class="ga-muted small">Clienti · Polizze · Incassi · Sinistri</div>
    </div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }} py-2 small" role="alert">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
    <p class="text-center ga-muted small mt-4 mb-0">v{{ versione }}</p>
  </main>
</body>
</html>
