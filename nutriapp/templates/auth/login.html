{% extends "base.html" %}
{% block title %}Accedi · NutriStudio{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 78vh;">
  <div class="col-md-6 col-lg-4">
    <div class="text-center mb-4">
      <div class="ns-avatar ns-avatar-lg mx-auto mb-2"><i class="bi bi-flower1 fs-4"></i></div>
      <h1 class="h4 mb-1">NutriStudio</h1>
      <p class="text-tenue small mb-0">Area riservata dello studio e degli assistiti</p>
    </div>

    <div class="card shadow-sm">
      <div class="card-body p-4">
        <form method="post" novalidate>
          <input type="hidden" name="next" value="{{ next }}">
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" type="email" id="email" name="email" required autofocus autocomplete="username">
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" type="password" id="password" name="password" required autocomplete="current-password">
          </div>
          <button class="btn btn-success w-100" type="submit"><i class="bi bi-box-arrow-in-right"></i> Entra</button>
        </form>
      </div>
    </div>

    <p class="text-center small text-tenue mt-3 mb-0">
      Sei un assistito e non hai le credenziali? Chiedile al tuo nutrizionista:
      le riceverai via email.
    </p>
  </div>
</div>
{% endblock %}
