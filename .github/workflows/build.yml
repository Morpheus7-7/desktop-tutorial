name: Test e build

# Avvio manuale (Actions → «Test e build» → Run workflow) o su tag di release
# (es. v1.0.0). NON scatta a ogni push/PR: così non genera check rossi se
# GitHub Actions non è abilitato sull'account. Vedi PACKAGING.md.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Esegui i test
        run: python -m pytest -q

  build-windows:
    name: Build eseguibili Windows (.exe)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Installa dipendenze di build
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
      - name: Compila il Gestionale Assicurativo
        run: pyinstaller gestionale.spec --noconfirm
      - name: Compila NutriStudio
        run: pyinstaller nutristudio.spec --noconfirm
      - name: Verifica che gli eseguibili esistano
        shell: pwsh
        run: |
          foreach ($exe in @("dist/GestionaleAssicurativo.exe", "dist/NutriStudio.exe")) {
            if (-not (Test-Path $exe)) { throw "Eseguibile non trovato: $exe" }
            Get-Item $exe | Format-List Name, Length
          }
      - name: Carica il Gestionale come artifact
        uses: actions/upload-artifact@v4
        with:
          name: GestionaleAssicurativo-windows
          path: dist/GestionaleAssicurativo.exe
          if-no-files-found: error
      - name: Carica NutriStudio come artifact
        uses: actions/upload-artifact@v4
        with:
          name: NutriStudio-windows
          path: dist/NutriStudio.exe
          if-no-files-found: error
