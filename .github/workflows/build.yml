name: Test e build

# Avvio manuale (Actions → «Test e build» → Run workflow) o su tag di release
# (es. v1.0.0). NON scatta a ogni push/PR: così non genera check rossi se
# GitHub Actions non è abilitato sull'account. Vedi PACKAGING.md.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Esegui i test
        run: python -m pytest -q

  build-windows:
    name: Build eseguibile Windows (.exe)
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Installa dipendenze di build
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
      - name: Compila con PyInstaller
        run: pyinstaller gestionale.spec --noconfirm
      - name: Verifica che l'eseguibile esista
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/DealCombined.exe")) {
            throw "Eseguibile non trovato in dist/"
          }
          Get-Item "dist/DealCombined.exe" | Format-List Name, Length
      - name: Crea l'installatore (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $versione = python -c "import gestionale; print(gestionale.__version__)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersioneApp=$versione" installer\DealCombined.iss
      - name: Impronta SHA-256 dell'installatore
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/Installa-DealCombined.exe -Algorithm SHA256).Hash.ToLower()
          "$h  Installa-DealCombined.exe" | Set-Content -Encoding ascii dist/Installa-DealCombined.exe.sha256
      - name: Carica eseguibile e installatore come artifact
        uses: actions/upload-artifact@v4
        with:
          name: DealCombined-windows
          path: |
            dist/DealCombined.exe
            dist/Installa-DealCombined.exe
            dist/Installa-DealCombined.exe.sha256
          if-no-files-found: error
      # Su un tag (es. v2.1.0) pubblica la Release: i programmi installati la
      # trovano da soli in Impostazioni → Aggiornamenti.
      - name: Pubblica la Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Installa-DealCombined.exe
            dist/Installa-DealCombined.exe.sha256
