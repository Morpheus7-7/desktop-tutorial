name: Deploy Cali100 PWA su GitHub Pages

# Pubblica la cartella statica calisthenics-app/ su GitHub Pages.
# Richiede: Settings -> Pages -> Build and deployment -> Source = "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - 'calisthenics-app/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo deploy alla volta.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Pages
        uses: actions/configure-pages@v5

      - name: Carica l'artifact (solo la PWA)
        uses: actions/upload-pages-artifact@v3
        with:
          path: calisthenics-app

      - name: Deploy su Pages
        id: deployment
        uses: actions/deploy-pages@v4
